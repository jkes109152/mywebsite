<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050714">
<title>NEON PONG // Human vs Neural Core</title>
<style>
:root{--cyan:#61e7ff;--violet:#b96cff;--pink:#ff4fd8;--good:#7dffbc;--muted:#9aa4bd}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;color:#f7f8fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 15%,rgba(185,108,255,.15),transparent 25%),radial-gradient(circle at 86% 78%,rgba(97,231,255,.12),transparent 30%),linear-gradient(135deg,#03040b,#080b19 50%,#04050d)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at center,#000 30%,transparent 85%)}button{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:13px;padding:max(15px,env(safe-area-inset-top)) max(15px,env(safe-area-inset-right)) max(13px,env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left))}.top,.bottom{width:min(1180px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px;letter-spacing:.14em;font-weight:850;font-size:12px}.mark{width:37px;height:37px;border:1px solid rgba(255,255,255,.12);border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(97,231,255,.12),rgba(185,108,255,.1))}.mark:after{content:"";width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--cyan),0 0 28px var(--violet)}.status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 15px var(--good)}.stage{position:relative;width:min(1180px,100%);height:100%;min-height:0;margin:auto;border:1px solid rgba(255,255,255,.13);border-radius:30px;overflow:hidden;background:rgba(5,7,20,.72);box-shadow:0 28px 90px rgba(0,0,0,.48),inset 0 0 120px rgba(97,231,255,.018)}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),inset 0 -110px 120px rgba(0,0,0,.16)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}.hud{position:absolute;inset:0;pointer-events:none}.score{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:25px;font-variant-numeric:tabular-nums}.n{font-size:clamp(30px,4vw,56px);font-weight:850;line-height:1;letter-spacing:-.05em;text-shadow:0 0 30px rgba(255,255,255,.16)}.sep{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.4)}.labels{position:absolute;top:85px;left:22px;right:22px;display:flex;justify-content:space-between;color:rgba(255,255,255,.4);font-size:9px;letter-spacing:.18em;font-weight:750}.round{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.09);background:rgba(2,4,12,.35);backdrop-filter:blur(12px);color:rgba(255,255,255,.52);font-size:9px;letter-spacing:.13em}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle,rgba(5,7,20,.2),rgba(5,7,20,.7));backdrop-filter:blur(6px);z-index:5;transition:.3s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(590px,100%);border:1px solid rgba(255,255,255,.13);background:linear-gradient(145deg,rgba(12,17,38,.88),rgba(8,10,25,.8));border-radius:28px;padding:clamp(22px,4vw,38px);box-shadow:0 28px 90px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.04);text-align:center}.eye{font-size:10px;letter-spacing:.24em;color:var(--cyan);font-weight:850}h1{margin:12px 0;font-size:clamp(40px,6vw,72px);line-height:.91;letter-spacing:-.065em}.grad{background:linear-gradient(90deg,#fff,#bff6ff 36%,#d1b4ff 70%,#ffb6ef);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{max-width:470px;margin:auto;color:var(--muted);line-height:1.65;font-size:13px}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:25px 0 13px}.diff{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#d8ddec;border-radius:16px;padding:12px 8px;cursor:pointer;transition:.2s}.diff:hover{transform:translateY(-2px);border-color:rgba(97,231,255,.3)}.diff.active{border-color:rgba(97,231,255,.48);background:linear-gradient(145deg,rgba(97,231,255,.12),rgba(185,108,255,.1));box-shadow:0 0 28px rgba(97,231,255,.08)}.diff strong{display:block;font-size:11px}.diff span{display:block;margin-top:3px;color:#78829a;font-size:9px}.primary{width:100%;border:0;border-radius:17px;padding:15px 20px;cursor:pointer;color:#050714;font-weight:900;letter-spacing:.08em;background:linear-gradient(90deg,#83efff,#c391ff 58%,#ff8be6);box-shadow:0 12px 34px rgba(134,120,255,.22);transition:.2s}.primary:hover{transform:translateY(-2px);filter:brightness(1.06)}.hint{margin-top:13px;color:#66718b;font-size:10px}.endTitle{margin:10px 0;font-size:clamp(36px,5vw,58px)}.controls{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border:1px solid rgba(255,255,255,.12);border-bottom-color:rgba(255,255,255,.22);border-radius:7px;background:rgba(255,255,255,.045);color:#e0e5f5;font:600 9px ui-monospace,monospace}.actions{display:flex;gap:8px}.mini{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:#c7cede;border-radius:12px;padding:8px 10px;cursor:pointer;font-size:10px}@media(max-width:640px){.app{gap:8px;padding:9px}.status span:last-child{display:none}.stage{border-radius:22px}.bottom{justify-content:center}.controls{display:none}.labels{top:73px}.score{top:18px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark"></div><div>NEON PONG <span style="opacity:.35">//</span> 01</div></div><div class="status"><span class="dot"></span><span>NEURAL CORE ONLINE</span><span>• REAL-TIME SIMULATION</span></div></header>
<main class="stage" id="stage"><canvas id="game" aria-label="乒乓球遊戲"></canvas><div class="hud"><div class="score"><span class="n" id="ps">0</span><span class="sep"></span><span class="n" id="as">0</span></div><div class="labels"><span>HUMAN / LEFT</span><span>NEURAL CORE / RIGHT</span></div><div class="round" id="round">FIRST TO 7 · READY</div></div>
<section class="overlay" id="start"><div class="card"><div class="eye">HUMAN VS NEURAL CORE</div><h1 class="grad">NEON<br>PONG</h1><p class="sub">帶有預判 AI、動態光影、粒子尾跡、合成音效與逐拍加速機制的單人乒乓對決。先拿到 7 分的人獲勝。</p><div class="difficulty"><button class="diff" data-d="calm"><strong>CALM</strong><span>反應較慢</span></button><button class="diff active" data-d="core"><strong>CORE</strong><span>平衡競技</span></button><button class="diff" data-d="apex"><strong>APEX</strong><span>高壓預判</span></button></div><button class="primary" id="go">ENTER THE ARENA</button><div class="hint">滑鼠 / 觸控移動 · W/S 或 ↑/↓ · P 暫停</div></div></section>
<section class="overlay hidden" id="end"><div class="card"><div class="eye">MATCH COMPLETE</div><h2 class="endTitle grad" id="endTitle">VICTORY</h2><p class="sub" id="endText"></p><div style="height:22px"></div><button class="primary" id="again">RUN IT BACK</button></div></section></main>
<footer class="bottom"><div class="controls"><span>MOVE</span><kbd>W</kbd><kbd>S</kbd><span>/</span><kbd>↑</kbd><kbd>↓</kbd><span style="margin-left:7px">PAUSE</span><kbd>P</kbd></div><div class="actions"><button class="mini" id="sound">SOUND · ON</button><button class="mini" id="pause">PAUSE</button></div></footer>
</div>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s),cv=$("#game"),ctx=cv.getContext("2d"),stage=$("#stage"),start=$("#start"),end=$("#end"),ps=$("#ps"),as=$("#as"),round=$("#round"),pauseBtn=$("#pause"),soundBtn=$("#sound");
let W=1000,H=600,dpr=1,last=performance.now(),elapsed=0,running=false,paused=false,over=false,soundOn=true,diff="core",serve=.8,rally=0,shake=0,flash=0,audioCtx=null;
const WIN=7,preset={calm:{speed:.60,error:58,think:.12,pred:.42},core:{speed:.83,error:24,think:.17,pred:.78},apex:{speed:1.03,error:7,think:.24,pred:.96}},S={p:{y:.5,t:.5,score:0,v:0},ai:{y:.5,t:.5,score:0,v:0,think:0},b:{x:.5,y:.5,vx:1,vy:.12,speed:.64,r:8},pointer:.5,keys:new Set()},trail=[],sparks=[];
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,r.width*dpr|0);cv.height=Math.max(1,r.height*dpr|0);W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);S.b.r=Math.max(6,Math.min(10,W*.008))}
function ac(){if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}
function tone(f,d=.05,g=.03,type="sine",slide=1){if(!soundOn)return;try{const a=ac(),t=a.currentTime,o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function hit(pow=1){tone(180+Math.random()*80,.035,.023*pow,"square",.75);tone(620+Math.random()*150,.055,.011*pow,"sine",1.3)}
function burst(x,y,c,n=10,p=.7){const a=c?['#fff','#b96cff','#ff4fd8']:['#fff','#61e7ff','#8ab9ff'];for(let i=0;i<n;i++){const q=Math.random()*Math.PI*2,s=(55+Math.random()*190)*p;sparks.push({x,y,vx:Math.cos(q)*s,vy:Math.sin(q)*s,l:.35+Math.random()*.5,m:.85,z:1+Math.random()*3,c:a[Math.random()*a.length|0]})}}
function reset(dir=Math.random()<.5?-1:1){Object.assign(S.b,{x:.5,y:.45+Math.random()*.1,speed:.64});const a=Math.random()*.56-.28;S.b.vx=Math.cos(a)*dir;S.b.vy=Math.sin(a);serve=.78;rally=0;trail.length=0}
function match(){S.p.score=S.ai.score=0;ps.textContent=as.textContent=0;S.p.y=S.p.t=S.ai.y=S.ai.t=.5;over=paused=false;running=true;pauseBtn.textContent="PAUSE";start.classList.add("hidden");end.classList.add("hidden");reset();round.textContent=`FIRST TO ${WIN} · ${diff.toUpperCase()}`;last=performance.now();ac()}
function finish(){over=true;running=false;const won=S.p.score>S.ai.score;$("#endTitle").textContent=won?"VICTORY":"DEFEAT";$("#endText").textContent=won?`你以 ${S.p.score} : ${S.ai.score} 擊穿了 Neural Core。`:`Neural Core 以 ${S.ai.score} : ${S.p.score} 完成預判。再來一次。`;end.classList.remove("hidden");tone(won?523:164,.8,.04,won?"sine":"sawtooth",won?2:.42)}
function point(player){if(player){S.p.score++;ps.textContent=S.p.score}else{S.ai.score++;as.textContent=S.ai.score}flash=1;shake=9;tone(player?440:190,.14,.04,"sawtooth",player?1.8:.55);burst(W/2,H/2,!player,34,1.6);if(S.p.score>=WIN||S.ai.score>=WIN)setTimeout(finish,400);else reset(player?-1:1)}
function predict(){const b=S.b,p=preset[diff];if(b.vx<=0)return .5+Math.sin(elapsed*.7)*.035;const tx=(.925-b.x)/Math.max(.001,b.vx*b.speed);let y=b.y+b.vy*b.speed*tx;while(y<.03||y>.97){if(y<.03)y=.06-y;if(y>.97)y=1.94-y}return y*p.pred+b.y*(1-p.pred)+(p.error/H)*(Math.random()*2-1)}
function update(dt){elapsed+=dt;if(!running||paused||over)return;const ph=Math.max(82,H*.165),pn=ph/H,p=preset[diff];let km=0;if(S.keys.has("w")||S.keys.has("arrowup"))km--;if(S.keys.has("s")||S.keys.has("arrowdown"))km++;S.p.t=km?S.p.t+km*dt*.83:S.pointer;S.p.t=Math.max(pn/2+.018,Math.min(1-pn/2-.018,S.p.t));const old=S.p.y;S.p.y+=(S.p.t-S.p.y)*Math.min(1,dt*18);S.p.v=(S.p.y-old)/Math.max(dt,.001);S.ai.think-=dt;if(S.ai.think<=0){S.ai.think=p.think;S.ai.t=predict()}S.ai.t=Math.max(pn/2+.018,Math.min(1-pn/2-.018,S.ai.t));const ad=S.ai.t-S.ai.y;S.ai.y+=Math.sign(ad)*Math.min(Math.abs(ad),dt*p.speed);S.ai.v=ad;if(serve>0){serve-=dt;return}const b=S.b;b.x+=b.vx*b.speed*dt;b.y+=b.vy*b.speed*dt;trail.push({x:b.x,y:b.y,l:1});if(trail.length>24)trail.shift();if(b.y<.025&&b.vy<0){b.y=.025;b.vy*=-1;hit(.5);burst(b.x*W,b.y*H,0,4,.4)}if(b.y>.975&&b.vy>0){b.y=.975;b.vy*=-1;hit(.5);burst(b.x*W,b.y*H,1,4,.4)}const px=.068,ax=.932,pw=Math.max(12,W*.012)/W,hr=pn/2+b.r/H;if(b.vx<0&&b.x<=px+pw/2+b.r/W&&b.x>px-.04&&Math.abs(b.y-S.p.y)<hr){b.x=px+pw/2+b.r/W;const rel=(b.y-S.p.y)/(pn/2);b.vx=Math.abs(b.vx);b.vy=Math.max(-.86,Math.min(.86,b.vy+rel*.46+S.p.v*.018));const l=Math.hypot(b.vx,b.vy);b.vx/=l;b.vy/=l;b.speed=Math.min(1.38,b.speed*1.052);rally++;shake=Math.min(6,2+rally*.12);hit(1+rally*.03);burst(b.x*W,b.y*H,0,8,.7)}if(b.vx>0&&b.x>=ax-pw/2-b.r/W&&b.x<ax+.04&&Math.abs(b.y-S.ai.y)<hr){b.x=ax-pw/2-b.r/W;const rel=(b.y-S.ai.y)/(pn/2);b.vx=-Math.abs(b.vx);b.vy=Math.max(-.86,Math.min(.86,b.vy+rel*.44+S.ai.v*.05));const l=Math.hypot(b.vx,b.vy);b.vx/=l;b.vy/=l;b.speed=Math.min(1.38,b.speed*1.052);rally++;shake=Math.min(6,2+rally*.12);hit(1+rally*.03);burst(b.x*W,b.y*H,1,8,.7)}if(b.x<-.04)point(false);if(b.x>1.04)point(true);for(const t of trail)t.l-=dt*2.8;for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.985;s.vy*=.985;if(s.l<=0)sparks.splice(i,1)}shake*=Math.pow(.0008,dt);flash*=Math.pow(.004,dt)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function arena(){ctx.clearRect(0,0,W,H);let g=ctx.createRadialGradient(W*.5,H*.52,20,W*.5,H*.52,Math.max(W,H)*.7);g.addColorStop(0,"rgba(33,46,92,.18)");g.addColorStop(.46,"rgba(16,22,49,.09)");g.addColorStop(1,"rgba(0,0,0,.12)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.22;for(let y=H*.12;y<H;y+=48){g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,"rgba(97,231,255,0)");g.addColorStop(.5,"rgba(255,255,255,.13)");g.addColorStop(1,"rgba(185,108,255,0)");ctx.fillStyle=g;ctx.fillRect(0,y,W,1)}ctx.restore();ctx.save();ctx.setLineDash([5,13]);ctx.strokeStyle="rgba(255,255,255,.14)";ctx.beginPath();ctx.moveTo(W/2,H*.08);ctx.lineTo(W/2,H*.92);ctx.stroke();ctx.restore();ctx.strokeStyle="rgba(255,255,255,.055)";ctx.beginPath();ctx.arc(W/2,H/2,H*.16,0,Math.PI*2);ctx.stroke();const y=(elapsed*45)%H;g=ctx.createLinearGradient(0,y-18,0,y+18);g.addColorStop(0,"transparent");g.addColorStop(.5,"rgba(97,231,255,.027)");g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.fillRect(0,y-18,W,36)}
function paddle(xn,yn,ai){const x=xn*W,h=Math.max(82,H*.165),w=Math.max(12,W*.012),y=yn*H-h/2,c=ai?"#b96cff":"#61e7ff";ctx.save();ctx.shadowColor=c;ctx.shadowBlur=28;const g=ctx.createLinearGradient(x-w/2,y,x+w/2,y+h);g.addColorStop(0,"#fff");g.addColorStop(.33,c);g.addColorStop(1,ai?"#7136d1":"#247fb8");ctx.fillStyle=g;rr(x-w/2,y,w,h,w/2);ctx.fill();ctx.restore()}
function ball(){const b=S.b;for(let i=0;i<trail.length;i++){const t=trail[i];ctx.save();ctx.globalAlpha=(i/trail.length)*Math.max(0,t.l)*.24;ctx.fillStyle=b.vx>0?"#b96cff":"#61e7ff";ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=16;ctx.beginPath();ctx.arc(t.x*W,t.y*H,b.r*(.25+.6*i/trail.length),0,Math.PI*2);ctx.fill();ctx.restore()}const x=b.x*W,y=b.y*H,c=b.vx>0?"#c387ff":"#7eedff";ctx.save();ctx.shadowColor=c;ctx.shadowBlur=28;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,b.r,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.save();if(shake>.08)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);arena();paddle(.068,S.p.y,0);paddle(.932,S.ai.y,1);ball();for(const s of sparks){ctx.save();ctx.globalAlpha=Math.max(0,s.l/s.m);ctx.fillStyle=s.c;ctx.shadowColor=s.c;ctx.shadowBlur=10;ctx.fillRect(s.x,s.y,s.z,s.z);ctx.restore()}if(serve>0&&running){const q=Math.max(0,Math.min(1,1-serve/.78));ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,24,-Math.PI/2,-Math.PI/2+q*Math.PI*2);ctx.stroke()}ctx.restore();if(paused&&running){ctx.fillStyle="rgba(3,4,12,.6)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="800 18px system-ui";ctx.fillText("PAUSED",W/2,H/2)}if(flash>.02){ctx.globalAlpha=flash*.14;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}}
function loop(now){const dt=Math.min(.025,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
function pointer(y){const r=cv.getBoundingClientRect();S.pointer=Math.max(.02,Math.min(.98,(y-r.top)/r.height))}function toggle(){if(!running||over)return;paused=!paused;pauseBtn.textContent=paused?"RESUME":"PAUSE";round.textContent=paused?"SIMULATION PAUSED":`FIRST TO ${WIN} · ${diff.toUpperCase()}`;tone(paused?220:480,.06,.025,"sine",1.25)}
cv.addEventListener("pointermove",e=>pointer(e.clientY));cv.addEventListener("pointerdown",e=>{pointer(e.clientY);ac()});addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowup","arrowdown","w","s"].includes(k))e.preventDefault();if(k==="p"){e.preventDefault();toggle();return}S.keys.add(k)});addEventListener("keyup",e=>S.keys.delete(e.key.toLowerCase()));addEventListener("blur",()=>{if(running&&!paused)toggle()});addEventListener("resize",resize);document.querySelectorAll(".diff").forEach(b=>b.onclick=()=>{diff=b.dataset.d;document.querySelectorAll(".diff").forEach(x=>x.classList.toggle("active",x===b));tone(360,.04,.018,"sine",1.18)});$("#go").onclick=match;$("#again").onclick=match;pauseBtn.onclick=toggle;soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=`SOUND · ${soundOn?"ON":"OFF"}`;if(soundOn)tone(520,.08,.025,"sine",1.4)};resize();reset(1);requestAnimationFrame(loop);
})();
</script>
</body></html>

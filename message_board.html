<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>留言板 - 思齊雲端硬碟</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2em auto; }
    textarea { width: 100%; height: 100px; }
    button { margin-top: 10px; padding: 10px 20px; }
    .notice { color: green; margin-top: 1em; }
  </style>
</head>
<body>

  <h2>📮 留言板</h2>

  <form id="messageForm">
    <textarea id="messageContent" name="content" placeholder="輸入留言，例如 @Amy 或 @all" required></textarea>
    <button type="submit">送出留言</button>
  </form>

  <div id="response" class="notice"></div>

  <script src="js/send_message.js"></script>

</body>
</html>
